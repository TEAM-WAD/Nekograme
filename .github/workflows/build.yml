name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dev", "ci" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      # 1. الحل الجذري: إنشاء ذاكرة وهمية 10GB لمنع انهيار OOM Killer
      - name: Create 10GB Swap Space
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 ndk;27.0.12077973 platforms;android-35"

      - name: Prepare Configs & Restrict Architecture
        run: |
          # تقييد التجميع بمعمارية واحدة (arm64-v8a) لتقليل وقت التجميع للنصف
          cat << 'EOF' > local.properties
          apiId=6
          apiHash=eb066357ef23a52e23bf69c35832b100
          helperBotId=0
          helperBotUsername=dummy
          sentryDsn=
          mapsApiKey=dummy
          abiList=arm64-v8a
          EOF

          # إنشاء google-services.json وهمي لتفادي أخطاء القراءة
          mkdir -p TMessagesProj_App
          cat << 'EOF' > TMessagesProj_App/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:000000000000",
                  "android_client_info": {
                    "package_name": "tw.nekomimi.nekogram"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          touch sentry.properties

          # حقن صلاحية الإنترنت في AndroidManifest
          MANIFEST_FILE=$(find TMessagesProj_App -name "AndroidManifest.xml" 2>/dev/null | head -n 1)
          if [ -n "$MANIFEST_FILE" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST_FILE"
            fi
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PabiList=arm64-v8a --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neko-App-Debug
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
