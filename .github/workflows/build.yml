name: Guaranteed Fast Build

on:
  push:
    branches: [ "main", "master", "dev", "ci" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Memory and Prebuilt Setup
        run: |
          # 1. زيادة ذاكرة الـ Swap بالسيرفر لـ 8 جيجا
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true

          # 2. إجبار الذاكرة على مستوى الجهاز بدون لمس ملف المشروع الأصلي
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m" > ~/.gradle/gradle.properties

          # 3. إنشاء local.properties
          cat << 'EOF' > local.properties
          apiId=6
          apiHash=eb066357ef23a52e23bf69c35832b100
          helperBotId=0
          helperBotUsername=dummy
          sentryDsn=
          mapsApiKey=dummy
          abiList=arm64-v8a
          EOF

          # 4. ملف Google وهمي احتياطي
          mkdir -p TMessagesProj_App
          cat << 'EOF' > TMessagesProj_App/google-services.json
          {
            "project_info": { "project_number": "000000000000", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [
              { "client_info": { "mobilesdk_app_id": "1:0:a:0", "android_client_info": { "package_name": "tw.nekomimi.nekogram.beta" } }, "api_key": [{ "current_key": "AIzaSyDummy" }] },
              { "client_info": { "mobilesdk_app_id": "1:0:a:0", "android_client_info": { "package_name": "tw.nekomimi.nekogram" } }, "api_key": [{ "current_key": "AIzaSyDummy" }] }
            ],
            "configuration_version": "1"
          }
          EOF
          touch sentry.properties

          # 5. تنزيل مكتبات الـ SO الجاهزة وتفريغ C++
          mkdir -p TMessagesProj_App/src/main/jniLibs/arm64-v8a
          curl -L -o release.apk https://github.com/Nekogram/Nekogram/releases/download/v11.6.0-10080/Nekogram-v11.6.0-10080-arm64-v8a.apk || true
          if [ -f "release.apk" ]; then
            unzip -o release.apk "lib/arm64-v8a/*" -d temp_so || true
            cp -r temp_so/lib/arm64-v8a/* TMessagesProj_App/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          fi

          find . -name "CMakeLists.txt" -exec sh -c 'echo "cmake_minimum_required(VERSION 3.10.2)" > "$1"; echo "project(dummy)" >> "$1"' _ {} \;

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug \
            -PabiList=arm64-v8a \
            -x processDebugGoogleServices \
            --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Neko-App-Debug
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
