name: Official Working Arm64 Build

on:
  push:
    branches: [ "main", "master", "dev", "ci" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Matching NDK Version
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724"

      - name: System & Environment Setup
        run: |
          # 1. تفعيل Swap بقدرة 8GB
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true

          # 2. إعداد الذاكرة للنظام
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m" > ~/.gradle/gradle.properties

          # 3. إعداد local.properties
          cat << EOF > local.properties
          sdk.dir=/usr/local/lib/android/sdk
          ndk.dir=/usr/local/lib/android/sdk/ndk/27.3.13750724
          apiId=30357243
          apiHash=9782c26101c502f026721b8e7993786c
          helperBotId=0
          helperBotUsername=dummy
          appCenterHash=
          appCenterHashBeta=
          sentryDsn=
          mapsApiKey=
          abiList=arm64-v8a
          EOF

          # 4. إنشاء مفتاح توقيع موحد
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

          # 5. ملف Google وهمي مستقر
          mkdir -p TMessagesProj_App
          cat << 'EOF' > TMessagesProj_App/google-services.json
          {
            "project_info": { "project_number": "000000000000", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [
              { "client_info": { "mobilesdk_app_id": "1:0:a:0", "android_client_info": { "package_name": "tw.nekomimi.nekogram" } }, "api_key": [{ "current_key": "AIzaSyDummy" }] }
            ],
            "configuration_version": "1"
          }
          EOF
          touch sentry.properties

      - name: Hardcode API Keys into BuildVars.java
        run: |
          # حفر الـ API ID والـ API HASH بشكل مباشر وجبري داخل ملفات الكود
          find . -name "BuildVars.java" -exec sed -i 's/public static int APP_ID = .*/public static int APP_ID = 30357243;/g' {} +
          find . -name "BuildVars.java" -exec sed -i 's/public static String APP_HASH = .*/public static String APP_HASH = "9782c26101c502f026721b8e7993786c";/g' {} +
          find . -name "BuildVars.java" -exec sed -i 's/public static boolean DEBUG_VERSION = .*/public static boolean DEBUG_VERSION = false;/g' {} +

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Arm64 APK
        run: ./gradlew :TMessagesProj_App:assembleDebug -PabiList=arm64-v8a --no-daemon

      - name: Sign APK
        run: |
          BUILD_TOOLS_VER=$(ls $ANDROID_HOME/build-tools | tail -n 1)
          APK_PATH=$(find TMessagesProj_App/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/$BUILD_TOOLS_VER/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android "$APK_PATH" || true
          fi

      - name: Upload Working APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nekogram-Working-Arm64
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
