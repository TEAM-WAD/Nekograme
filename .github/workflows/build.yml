name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dev", "ci" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 ndk;27.0.12077973 platforms;android-35"

      - name: Create Dummy Configs & Inject Permissions
        run: |
          # 1. إنشاء local.properties بالقيم المطلوبة
          cat << 'EOF' > local.properties
          apiId=6
          apiHash=eb066357ef23a52e23bf69c35832b100
          helperBotId=0
          helperBotUsername=dummy
          sentryDsn=
          mapsApiKey=dummy
          EOF

          # 2. إنشاء google-services.json وهمي لمنع خروج خطأ Null Pointer
          mkdir -p TMessagesProj_App
          cat << 'EOF' > TMessagesProj_App/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:000000000000",
                  "android_client_info": {
                    "package_name": "tw.nekomimi.nekogram"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          touch sentry.properties

          # 3. حقن صلاحية الإنترنت في الـ Manifest
          MANIFEST_FILE=$(find TMessagesProj_App -name "AndroidManifest.xml" 2>/dev/null | head -n 1)
          if [ -n "$MANIFEST_FILE" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST_FILE"
            fi
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neko-App-Debug
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk

      - name: Upload armeabi-v7a build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-armeabi-v7a.apk
          archive: false

      - name: Upload universal build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-universal.apk
          archive: false

      - name: Upload x86 build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-x86.apk
          archive: false

      - name: Upload x86_64 build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-x86_64.apk
          archive: false

      - name: Upload build bundle
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/bundle/play/*-play.aab
          archive: false
