name: Official Clean Arm64 Build

on:
  push:
    branches: [ "main", "master", "dev", "ci" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Matching NDK Version
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724"

      - name: System & Environment Setup
        run: |
          # 1. تفعيل Swap بقدرة 8GB
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true

          # 2. إعداد الذاكرة للنظام
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m" > ~/.gradle/gradle.properties

          # 3. إعداد local.properties واستكمال قيم التطبيق
          cat << EOF > local.properties
          sdk.dir=/usr/local/lib/android/sdk
          ndk.dir=/usr/local/lib/android/sdk/ndk/27.3.13750724
          apiId=6
          apiHash=eb066357ef23a52e23bf69c35832b100
          helperBotId=0
          helperBotUsername=dummy
          appCenterHash=00000000-0000-0000-0000-000000000000
          appCenterHashBeta=00000000-0000-0000-0000-000000000000
          sentryDsn=
          mapsApiKey=dummy
          abiList=arm64-v8a
          EOF

          # 4. ملف Google شاملاً لجميع أنواع الحزم (Debug و Beta و Release)
          mkdir -p TMessagesProj_App
          cat << 'EOF' > TMessagesProj_App/google-services.json
          {
            "project_info": { "project_number": "000000000000", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [
              { "client_info": { "mobilesdk_app_id": "1:0:a:0", "android_client_info": { "package_name": "tw.nekomimi.nekogram" } }, "api_key": [{ "current_key": "AIzaSyDummy" }] },
              { "client_info": { "mobilesdk_app_id": "1:0:a:0", "android_client_info": { "package_name": "tw.nekomimi.nekogram.debug" } }, "api_key": [{ "current_key": "AIzaSyDummy" }] },
              { "client_info": { "mobilesdk_app_id": "1:0:a:0", "android_client_info": { "package_name": "tw.nekomimi.nekogram.beta" } }, "api_key": [{ "current_key": "AIzaSyDummy" }] },
              { "client_info": { "mobilesdk_app_id": "1:0:a:0", "android_client_info": { "package_name": "tw.nekomimi.nekogram.beta.debug" } }, "api_key": [{ "current_key": "AIzaSyDummy" }] }
            ],
            "configuration_version": "1"
          }
          EOF
          touch sentry.properties

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Official Arm64 Debug APK
        run: ./gradlew assembleDebug -PabiList=arm64-v8a --no-daemon

      - name: Upload Single Arm64 APK Only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nekogram-Arm64-Single
          path: TMessagesProj_App/build/outputs/apk/**/*arm64-v8a*.apk
